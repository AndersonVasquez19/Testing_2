name: CI API (Laravel 13 + PostgreSQL)

on:
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/ci-api.yml']
  pull_request:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/ci-api.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

services:
  postgres:
    image: postgres:16
    env:
      POSTGRES_DB: horus_sistema_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - 5432:5432
    options: >-
      --health-cmd pg_isready
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5

jobs:
  api:
    name: Pint, Larastan y Pest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, zip, gd, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: Larastan (PHPStan nivel 9)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Pest (Unit, Feature y Architecture)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: horus_sistema_test
          DB_USERNAME: postgres
          DB_PASSWORD: root
        run: vendor/bin/pest
