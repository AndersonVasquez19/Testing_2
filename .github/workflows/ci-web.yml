name: CI Web (Nuxt + Vitest + Playwright)

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'apps/api/**', '.github/workflows/ci-web.yml']
  pull_request:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/ci-web.yml']
  workflow_dispatch:

permissions:
  contents: read

services:
  postgres:
    image: postgres:16
    env:
      POSTGRES_DB: horus_sistema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - 5432:5432
    options: >-
      --health-cmd pg_isready
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5

jobs:
  web:
    name: Typecheck, Vitest, Build y Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP 8.4 para backend E2E
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, zip, gd, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Preparar API Laravel
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan migrate --seed --force

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias Web y Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install chromium

      - name: Nuxt Typecheck y ESLint
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint

      - name: Pruebas unitarias (Vitest)
        working-directory: apps/web
        run: npm run test:unit

      - name: Compilar Nuxt
        working-directory: apps/web
        run: npm run build

      - name: Pruebas E2E (Playwright contra Laravel 13 + PostgreSQL)
        working-directory: apps/web
        run: npm run test:e2e
